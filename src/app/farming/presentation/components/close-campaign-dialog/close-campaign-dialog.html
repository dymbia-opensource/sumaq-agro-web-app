<h2 mat-dialog-title>
  {{ 'farming.campaigns.close-title' | translate: { season: data.season } }}
</h2>

<mat-dialog-content>
  <p class="warning">
    <mat-icon aria-hidden="true">lock</mat-icon>
    {{ 'farming.campaigns.close-warning' | translate }}
  </p>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ 'common.cancel' | translate }}</button>
  <button mat-flat-button (click)="onConfirm()">
    <mat-icon>task_alt</mat-icon>
    {{ 'farming.campaigns.close' | translate }}
  </button>
</mat-dialog-actions>
