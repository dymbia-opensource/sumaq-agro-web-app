<div class="sidebar-inner">
  <a class="brand" routerLink="/" (click)="layout.closeSidebarOnHandset()">
    <img src="images/logo-sumaqagro.png" alt="SumaqAgro" width="48" height="48" />
    <span class="brand-text">
      <span class="brand-name">Sumaq<span class="brand-accent">Agro</span></span>
      <span class="brand-tagline">{{ 'app.tagline' | translate }}</span>
    </span>
  </a>

  @for (section of sections(); track section.title; let last = $last) {
    <mat-nav-list class="menu-section">
      <h3 matSubheader>{{ section.title | translate }}</h3>
      @for (option of section.options; track option.link) {
        <a
          mat-list-item
          [routerLink]="option.link"
          [activated]="option.link === activeLink()"
          (click)="layout.closeSidebarOnHandset()"
        >
          <mat-icon matListItemIcon [class.icon-filled]="option.link === activeLink()">{{
            option.icon
          }}</mat-icon>
          <span matListItemTitle>{{ option.label | translate }}</span>
        </a>
      }
    </mat-nav-list>
    @if (!last) {
      <mat-divider />
    }
  }

  <div class="sidebar-footer">
    <app-language-switcher />
    <button mat-button class="sign-out" (click)="signOut()">
      <mat-icon>logout</mat-icon>
      {{ 'layout.sign-out' | translate }}
    </button>
  </div>
</div>
