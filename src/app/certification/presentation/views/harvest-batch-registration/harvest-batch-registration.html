<p class="form-section-title">{{ 'certification.form.intake-title' | translate }}</p>
<div class="form-grid">
  <label
    >{{ 'certification.form.member' | translate }} *<select
      [(ngModel)]="form.memberId"
      (ngModelChange)="memberChanged.emit()"
    >
      @for (member of members; track member.id) {
        <option [ngValue]="member.id">{{ member.name }}</option>
      }
    </select></label
  >
  <label
    >{{ 'certification.form.plot' | translate }} *<select [(ngModel)]="form.plotId">
      @for (plot of plots; track plot.id) {
        <option [ngValue]="plot.id">{{ plot.name }} ({{ plot.variety }})</option>
      }
    </select></label
  >
  <label
    >{{ 'certification.form.gross-kg' | translate }} *<input
      type="number"
      min="0"
      [(ngModel)]="form.grossKg"
  /></label>
  <label
    >{{ 'certification.form.tare-kg' | translate }} *<input
      type="number"
      min="0"
      [(ngModel)]="form.tareKg"
  /></label>
  <label
    >{{ 'certification.form.net-weight' | translate
    }}<input type="text" [value]="netKg | number: '1.0-2'" readonly
  /></label>
  <label
    >{{ 'certification.form.sample-kg' | translate }} *<input
      type="number"
      min="0.01"
      [(ngModel)]="form.sampleKg"
  /></label>
</div>
<p class="weight-hint">{{ 'certification.form.weight-hint' | translate }}</p>
