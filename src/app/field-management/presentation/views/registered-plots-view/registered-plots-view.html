@if (loading()) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="'common.loading' | translate" />
}

<app-page-header
  [breadcrumbs]="breadcrumbs"
  [title]="'field-management.plots.title' | translate"
  [subtitle]="
    (plotQuotaReady() ? 'field-management.plots.subtitle' : 'field-management.plots.quota-checking')
      | translate: { used: plotCount(), quota: plotQuota() }
  "
/>

<app-plot-quota-summary [showRefresh]="false" />

@if (error(); as error) {
  <app-message-card icon="error" [message]="error | translate" [alert]="true" />
}

<section class="plot-grid" [attr.aria-label]="'field-management.plots.title' | translate">
  <!-- Registered plots (US-28) -->
  @for (plot of plots(); track plot.id; let index = $index) {
    <app-plot-card
      [plot]="plot"
      [campaign]="campaigns().get(plot.id)"
      [position]="index + 1"
      [deletionDisabled]="loading() || !ownedPlotsReady()"
      (viewOnDashboard)="onSelectPlot($event)"
      (viewMonitoring)="onViewMonitoring($event)"
      (delineate)="onDelineate($event)"
      (viewDetail)="onViewDetail($event)"
      (recordSoil)="onRecordSoil($event)"
      (remove)="onDeletePlot($event)"
    />
  }

  <!-- Free slots of the plan (US-22) -->
  @for (number of freeSlots(); track number) {
    <app-plot-slot-card [position]="number" (register)="onRegisterNewPlot()" />
  }
</section>
